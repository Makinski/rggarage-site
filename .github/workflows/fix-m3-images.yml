name: Fix M3 image paths

on:
  push:
    paths:
      - .github/workflows/fix-m3-images.yml

permissions:
  contents: write

jobs:
  fix-m3-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply M3 image path fixes
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's#e92-01-front-doors\.jpg#e92-doors-open.jpg#g; s#e92-02-m-detail\.jpg#e92-m3-detail.jpg#g; s#e92-03-engine\.jpg#e92-engine.jpg#g; s#e92-04-wheel\.jpg#e92-wheel.jpg#g; s#e92-05-rear\.jpg#e92-rear.jpg#g' \
            index.html \
            cars/index.html \
            en/index.html \
            en/cars/index.html \
            cars/bmw-e92-m3/index.html \
            en/cars/bmw-e92-m3/index.html
          rm -f .github/workflows/fix-m3-images.yml

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cars/index.html en/index.html en/cars/index.html cars/bmw-e92-m3/index.html en/cars/bmw-e92-m3/index.html .github/workflows/fix-m3-images.yml
          git commit -m "Fix BMW M3 image paths"
          git push
